<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VW CC 2014 — Mechanic Assistant</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f12;
    --surface:   #151820;
    --border:    #252a34;
    --user-bg:   #0f2744;
    --user-text: #c8dff7;
    --ai-bg:     #151820;
    --ai-text:   #d8dce8;
    --accent:    #3d8ef0;
    --accent-dk: #2a6ac9;
    --cite-bg:   #101c12;
    --cite-bd:   #1f4024;
    --warn-bg:   #1c1000;
    --warn-bd:   #6b3d00;
    --warn-text: #f5c842;
    --reject-bg: #200808;
    --reject-bd: #7a1010;
    --muted:     #5a6075;
    --tag-bg:    #1a1f2e;
    --success:   #29a84e;
    --radius:    10px;
    --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono:      "Cascadia Code", "Fira Code", "Consolas", monospace;
  }

  html, body { height: 100%; background: var(--bg); color: var(--ai-text); font-family: var(--font); font-size: 15px; line-height: 1.6; }

  /* ── layout ── */
  body { display: flex; flex-direction: column; height: 100dvh; }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 15px; font-weight: 600; color: #e4e8f2; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  #status-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--tag-bg); border: 1px solid var(--border);
    color: var(--muted); white-space: nowrap;
  }
  #status-pill.ok  { border-color: #1d4a22; color: #4caf66; }
  #status-pill.err { border-color: #4a1d1d; color: #cf5a5a; }

  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 20px;
    scroll-behavior: smooth;
  }
  #chat:empty::after {
    content: "Ask anything about your 2014 VW CC 2.0T TSI";
    display: block;
    text-align: center;
    margin-top: 80px;
    color: var(--muted);
    font-size: 16px;
  }

  /* ── messages ── */
  .msg { display: flex; gap: 12px; max-width: 860px; margin: 0 auto 24px; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: var(--tag-bg);
  }
  .msg.user .avatar { background: var(--accent-dk); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    max-width: calc(100% - 48px);
    border: 1px solid var(--border);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border-color: #1e3d6a;
    color: var(--user-text);
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    border-color: var(--border);
  }

  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #e0e6f2; }
  .bubble code { font-family: var(--mono); font-size: 13px; background: #1f2535; padding: 1px 5px; border-radius: 4px; }

  /* ── specverify badge ── */
  .verify-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    margin-bottom: 10px;
  }
  .verify-badge.ok  { background: #0d2214; border: 1px solid #1f5230; color: #4caf66; }
  .verify-badge.bad { background: #200808; border: 1px solid #5a1010; color: #e06060; }

  /* ── conflict warnings ── */
  .conflict {
    margin-top: 10px; padding: 10px 14px;
    background: var(--warn-bg); border: 1px solid var(--warn-bd); border-radius: 8px;
    font-size: 13px; color: var(--warn-text);
    display: flex; gap: 8px; align-items: flex-start;
  }
  .conflict .icon { flex: 0 0 auto; margin-top: 1px; }

  /* ── citations ── */
  .citations {
    margin-top: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .citations-header {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 4px;
  }
  .cite-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--cite-bg); border: 1px solid var(--cite-bd); border-radius: 8px;
    text-decoration: none;
    transition: border-color .15s;
  }
  .cite-card:hover { border-color: var(--accent); }
  .cite-card .cicon { font-size: 16px; flex: 0 0 auto; }
  .cite-card .cinfo { flex: 1; min-width: 0; }
  .cite-card .ctitle { font-size: 13px; color: #b8d0e8; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cite-card .cmeta  { font-size: 11px; color: var(--muted); }
  .cite-card .cpage  { flex: 0 0 auto; font-size: 12px; color: var(--accent); font-weight: 600; }
  .cite-card .diagram-tag {
    flex: 0 0 auto; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: #0d1f30; border: 1px solid #1a3d5a; color: #5fa8d8;
  }

  /* ── video citations ── */
  .video-citations {
    margin-top: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .video-cite-card {
    display: flex; gap: 12px;
    padding: 10px 12px;
    background: #0e1520; border: 1px solid #1c2d45; border-radius: 8px;
    text-decoration: none;
    transition: border-color .15s;
  }
  .video-cite-card:hover { border-color: #3a6ea8; }
  .video-frame-thumb {
    flex: 0 0 160px; width: 160px; height: 90px;
    object-fit: cover; border-radius: 5px;
    border: 1px solid #1c2d45;
    background: #0a0d14;
    cursor: pointer;
  }
  .video-frame-thumb:hover { border-color: var(--accent); }
  .video-cite-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .video-cite-title { font-size: 13px; color: #b8d0e8; font-weight: 500; }
  .video-cite-meta  { font-size: 11px; color: var(--muted); }
  .video-cite-ts    { font-size: 12px; color: var(--accent); font-weight: 600; }
  .video-cite-preview { font-size: 12px; color: #6a7490; line-height: 1.5; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .video-conflict { font-size: 11px; color: var(--warn-text); margin-top: 4px; }

  /* ── full-frame lightbox ── */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.88); z-index: 9999;
    align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 6px; box-shadow: 0 8px 40px #000; }

  /* ── refused state ── */
  .refused-box {
    padding: 12px 16px;
    background: var(--reject-bg); border: 1px solid var(--reject-bd); border-radius: 8px;
    font-size: 13px; color: #cf7070;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .refused-box .reason { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── typing indicator ── */
  .typing .bubble { padding: 14px 18px; }
  .dots { display: flex; gap: 5px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: bounce .9s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: .5; }
    40%         { transform: translateY(-6px); opacity: 1; }
  }

  /* ── input bar ── */
  #input-bar {
    flex: 0 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
  }
  #input-form { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; }
  #q {
    flex: 1;
    background: #1a1e2a; border: 1px solid var(--border); color: var(--ai-text);
    border-radius: 8px; padding: 10px 14px; font-size: 15px; font-family: var(--font);
    outline: none; resize: none; min-height: 44px; max-height: 180px;
    transition: border-color .15s;
    overflow-y: hidden;
  }
  #q:focus { border-color: var(--accent-dk); }
  #q::placeholder { color: var(--muted); }
  #send-btn {
    flex: 0 0 auto;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: 0 18px;
    font-size: 15px; cursor: pointer; font-weight: 500;
    transition: background .15s;
    align-self: flex-end; height: 44px;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-dk); }
  #send-btn:disabled { background: #233; cursor: default; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">🔧</div>
  <div>
    <div class="h1">VW CC 2014 Mechanic Assistant</div>
    <div class="sub">2.0T TSI · Factory Manual RAG · Local-Only</div>
  </div>
  <div class="spacer"></div>
  <div id="status-pill">loading…</div>
</header>

<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<div id="chat"></div>

<div id="input-bar">
  <form id="input-form">
    <textarea id="q" rows="1" placeholder="Ask a question — e.g. throttle body bolt torque, DSG fluid change, timing chain replacement…" autocomplete="off"></textarea>
    <button id="send-btn" type="submit">Ask</button>
  </form>
</div>

<script>
const chat    = document.getElementById('chat');
const form    = document.getElementById('input-form');
const input   = document.getElementById('q');
const sendBtn = document.getElementById('send-btn');
const pill    = document.getElementById('status-pill');

// ── auto-resize textarea ───────────────────────────────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

// Submit on Enter (Shift+Enter for newline)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

// ── status ─────────────────────────────────────────────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch('/status');
    const d = await r.json();
    const ollamaTag = d.ollama_ok ? '' : ' · Ollama offline';
    pill.textContent = `${d.chunks.toLocaleString()} chunks · ${d.manuals} manuals${ollamaTag}`;
    pill.className   = d.ollama_ok ? 'ok' : 'err';
  } catch {
    pill.textContent = 'server offline';
    pill.className   = 'err';
  }
}
checkStatus();

// ── DOM helpers ────────────────────────────────────────────────────────────────
function appendMsg(role, innerHTML, extras = {}) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const icon = role === 'user' ? '👤' : '⚙';
  wrap.innerHTML = `
    <div class="avatar">${icon}</div>
    <div class="bubble">${innerHTML}</div>`;

  const bub = wrap.querySelector('.bubble');

  // Manual citation cards
  if (extras.citations && extras.citations.length) {
    const cites = document.createElement('div');
    cites.className = 'citations';
    cites.innerHTML = `<div class="citations-header">Source pages</div>`;
    for (const c of extras.citations) {
      const icon    = c.has_diagram ? '🗺' : '📄';
      const diagTag = c.has_diagram ? `<span class="diagram-tag">diagram</span>` : '';
      const a = document.createElement('a');
      a.className = 'cite-card';
      a.href      = c.viewer_url;
      a.target    = '_blank';
      a.rel       = 'noopener';
      a.innerHTML = `
        <span class="cicon">${icon}</span>
        <span class="cinfo">
          <div class="ctitle">${esc(c.manual_title)}</div>
          <div class="cmeta">${esc(c.section_title || c.manual_id)}</div>
        </span>
        ${diagTag}
        <span class="cpage">p.${c.page_physical}</span>`;
      cites.appendChild(a);
    }
    bub.appendChild(cites);
  }

  // Video citation cards with frames
  if (extras.video_citations && extras.video_citations.length) {
    const vcites = document.createElement('div');
    vcites.className = 'video-citations';
    vcites.innerHTML = `<div class="citations-header">Video sources</div>`;
    for (const v of extras.video_citations) {
      const card = document.createElement('div');
      card.className = 'video-cite-card';
      const frameHtml = v.frame_url
        ? `<img class="video-frame-thumb" src="${esc(v.frame_url)}" alt="frame" data-full="${esc(v.frame_url)}">`
        : `<div class="video-frame-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;">no frame</div>`;
      const ytLink = v.citation_url
        ? `<a href="${esc(v.citation_url)}" target="_blank" rel="noopener" class="video-cite-ts">▶ ~${esc(v.timestamp_label)} on YouTube</a>`
        : `<span class="video-cite-ts">~${esc(v.timestamp_label)}</span>`;
      const conflict = v.conflict_warning
        ? `<div class="video-conflict">⚠ ${esc(v.conflict_warning)}</div>` : '';
      card.innerHTML = `
        ${frameHtml}
        <div class="video-cite-info">
          <div class="video-cite-title">${esc(v.title)}</div>
          <div class="video-cite-meta">${esc(v.channel)}${v.system ? ' · ' + esc(v.system) : ''}</div>
          ${ytLink}
          <div class="video-cite-preview">${esc(v.text_preview)}</div>
          ${conflict}
        </div>`;
      vcites.appendChild(card);
    }
    bub.appendChild(vcites);
  }

  // Conflict warnings
  if (extras.conflicts && extras.conflicts.length) {
    for (const w of extras.conflicts) {
      const d = document.createElement('div');
      d.className = 'conflict';
      d.innerHTML = `<span class="icon">⚠</span><span>${esc(w)}</span>`;
      bub.appendChild(d);
    }
  }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function appendTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai typing';
  wrap.innerHTML = `<div class="avatar">⚙</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAnswer(d) {
  // Format answer text: handle newlines, inline citations
  let html = esc(d.answer)
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');
  html = `<p>${html}</p>`;

  // Highlight [Manual: ...] citations inline
  html = html.replace(
    /\[Manual:\s*([^\],]+),\s*Page\s*(\d+)\]/g,
    (_, mid, pg) =>
      `<a href="/viewer?manual=${encodeURIComponent(mid.trim())}&page=${pg}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:12px;">[📄 ${esc(mid.trim())} p.${pg}]</a>`
  );

  // Highlight warnings
  html = html.replace(/(⚠[^<\n]*)/g, '<span style="color:var(--warn-text)">$1</span>');
  html = html.replace(/\b(Replace)\b/g, '<strong style="color:#e06060">$1</strong>');
  html = html.replace(/(Stretch bolt[^<.!]*)/gi, '<strong style="color:#e06060">$1</strong>');

  // Specverify badge
  let badge = '';
  if (d.verify_findings && d.verify_findings.length) {
    badge = d.verified
      ? `<div class="verify-badge ok">✓ All numeric specs verified against source</div>`
      : `<div class="verify-badge bad">⚠ Spec verification failed — check source PDF</div>`;
  }

  return badge + html;
}

// ── submit handler ─────────────────────────────────────────────────────────────
form.addEventListener('submit', async e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  appendMsg('user', `<p>${esc(q)}</p>`);
  const typing = appendTyping();

  try {
    const resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q }),
    });
    const d = await resp.json();
    typing.remove();

    if (d.refused) {
      const why = d.gate_reason ? `<div class="reason">Retrieval gate: ${esc(d.gate_reason)}</div>` : '';
      appendMsg('ai', `<div class="refused-box"><span>🚫</span><div><div>${esc(d.answer)}</div>${why}</div></div>`);
    } else {
      appendMsg('ai', renderAnswer(d), {
        citations:       d.citations,
        video_citations: d.video_citations,
        conflicts:       d.conflicts,
      });
    }
  } catch (err) {
    typing.remove();
    appendMsg('ai', `<div class="refused-box"><span>🚫</span><div>Server error: ${esc(String(err))}</div></div>`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
// ── lightbox for video frames ──────────────────────────────────────────────────
const lightbox    = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

document.addEventListener('click', e => {
  const thumb = e.target.closest('.video-frame-thumb[data-full]');
  if (thumb) {
    lightboxImg.src = thumb.dataset.full;
    lightbox.classList.add('open');
    e.stopPropagation();
    return;
  }
  if (lightbox.classList.contains('open')) {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { lightbox.classList.remove('open'); lightboxImg.src = ''; }
});
</script>
</body>
</html>
