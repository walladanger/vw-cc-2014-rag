name: Ingestion benchmark tests

on:
  push:
    branches:
      - codex/cc-manual-ingestion-benchmark
  workflow_dispatch:

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run ingestion benchmark contract tests
        run: python -m pytest -q tests/test_ingestion_benchmark.py
