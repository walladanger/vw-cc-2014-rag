name: CC-T004 vehicle applicability

on:
  push:
    branches:
      - codex/cc-t004-vehicle-applicability
  pull_request:
    paths:
      - "cc_workshop/vehicle_profiles.py"
      - "cc_workshop/application/garage_routes.py"
      - "retrieve.py"
      - "tests/acceptance/test_vehicle_applicability.py"
      - "tests/acceptance/test_vehicle_profile_routes.py"
      - "tests/test_chroma_vehicle_applicability.py"
      - ".github/workflows/cc-t004-vehicle-applicability.yml"

jobs:
  vehicle-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask==3.1.3 rank-bm25==0.2.2
      - name: Run CC-T004 focused tests
        run: |
          python -m pytest -q \
            tests/acceptance/test_vehicle_applicability.py \
            tests/acceptance/test_vehicle_profile_routes.py \
            tests/test_chroma_vehicle_applicability.py
